<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 聊天助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; background: #f5f5f5; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #eee; background: #fff; }
  .header h1 { font-size: 16px; font-weight: 600; color: #333; }
  .new-chat { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; color: #666; transition: all .2s; }
  .new-chat:hover { border-color: #4f87ff; color: #4f87ff; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-wrap: break-word; white-space: pre-wrap; animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: #4f87ff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: #f0f2f5; color: #333; border-bottom-left-radius: 4px; }
  .msg.ai.streaming { border-left: 3px solid #4f87ff; }
  .msg.ai code { background: #e3e5e8; padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: "SF Mono", Consolas, monospace; }
  .msg.ai pre { background: #1e1e2e; color: #cdd6f4; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5; }
  .msg.ai pre code { background: none; padding: 0; color: inherit; }
  .msg.ai strong { font-weight: 600; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  .input-area { border-top: 1px solid #eee; padding: 12px 16px; background: #fff; display: flex; gap: 10px; align-items: flex-end; }
  .input-area textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; resize: none; outline: none; max-height: 120px; line-height: 1.5; font-family: inherit; }
  .input-area textarea:focus { border-color: #4f87ff; }
  .input-area button { width: 44px; height: 44px; border: none; border-radius: 8px; background: #4f87ff; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; flex-shrink: 0; }
  .input-area button:hover { background: #3a6fd8; }
  .input-area button:disabled { background: #ccc; cursor: not-allowed; }
  .input-area button svg { width: 20px; height: 20px; fill: currentColor; }
  @media (max-width: 480px) { .msg { max-width: 90%; font-size: 15px; } .messages { padding: 12px; } }
  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #999; gap: 8px; }
  .welcome svg { width: 48px; height: 48px; fill: #ddd; }
  .welcome p { font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>💬 AI 聊天助手</h1>
    <button class="new-chat" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
      <select id="roleSelect" style="height:44px;border:1px solid #ddd;border-radius:8px;padding:0 8px;font-size:13px;outline:none;">
          <option value="default">普通助手</option>
          <option value="comedian">脱口秀演员</option>
          <option value="interviewer">面试官</option>
          <option value="kid">小学生</option>
    <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="send()" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
<script>
// === Session Management ===
let sessionId = localStorage.getItem('chat_session_id');
if (!sessionId) {
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('chat_session_id', sessionId);
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let isLoading = false;

// === Load History ===
window.onload = async function() {
  try {
    const res = await fetch(`/api/history?sessionId=${sessionId}`);
    const history = await res.json();
    if (history.length === 0) { showWelcome(); return; }
    history.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'ai', false));
    scrollToBottom();
  } catch(e) { showWelcome(); }
};

function showWelcome() {
  messagesEl.innerHTML = `<div class="welcome">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <p>有什么想聊的？开始一段对话吧</p>
  </div>`;
}

function addMessage(text, role, isStreaming = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isStreaming ? ' streaming' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function updateMessage(el, text, done = false) {
  el.textContent = text;
  if (done) el.classList.remove('streaming');
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  sendBtn.disabled = el.value.trim() === '' || isLoading;
}

// === Send ===
async function send() {
  const msg = inputEl.value.trim();
  if (!msg || isLoading) return;

  // Remove welcome
  const welcome = messagesEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  // Show user message
  addMessage(msg, 'user');
  inputEl.value = '';
  autoResize(inputEl);

  // Show AI bubble with typing indicator
  const aiBubble = addMessage('', 'ai', true);
  isLoading = true;
  sendBtn.disabled = true;

  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  aiBubble.textContent = '';
  aiBubble.appendChild(typingEl);
  scrollToBottom();

  let fullText = '';

  try {
    const role = document.getElementById('roleSelect').value;
    const url = `/api/chat?msg=${encodeURIComponent(msg)}&sessionId=${encodeURIComponent(sessionId)}&role=${encodeURIComponent(role)}`;
    const eventSource = new EventSource(url);

    eventSource.onmessage = function(e) {
      if (e.data) {
        // Remove typing indicator on first data
        if (typingEl.parentNode) typingEl.remove();

        fullText += e.data + '\n';
        updateMessage(aiBubble, fullText, false);
      }
    };

    eventSource.onerror = function() {
      eventSource.close();
      if (fullText === '') {
        updateMessage(aiBubble, '出错了，请重试', true);
      } else {
        updateMessage(aiBubble, fullText, true);
      }
      isLoading = false;
      sendBtn.disabled = false;
      autoResize(inputEl);
    };
  } catch(e) {
    updateMessage(aiBubble, '请求失败: ' + e.message, true);
    isLoading = false;
    sendBtn.disabled = false;
    autoResize(inputEl);
  }
}

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function newChat() {
  if (!confirm('确定开始新对话？当前聊天记录将被清除。')) return;
  fetch(`/api/clear?sessionId=${sessionId}`);
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('chat_session_id', sessionId);
  messagesEl.innerHTML = '';
  showWelcome();
}
</script>
</body>
</html>
